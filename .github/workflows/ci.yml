name: Offline correctness
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m project_demo prepare --mode fixture
      - run: python -m project_demo demo --mode fixture
      - run: python -m project_demo evaluate --mode fixture
